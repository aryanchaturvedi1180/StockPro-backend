# APPLICATION CONFIG
spring.application.name=auth-service
server.port=8081


# = DATABASE CONFIG (MySQL)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/stockpro_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# = JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# = FLYWAY MIGRATION
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# = EUREKA CLIENT
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true


# = EXCLUDE AUTO CONFIG
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration


# = ACTUATOR
management.endpoints.web.exposure.include=health,info


# = JWT CONFIG
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=28800000


# = JACKSON CONFIG
spring.jackson.serialization.write-dates-as-timestamps=false


# = REDIS CONFIG
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}


# = SWAGGER / OPENAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true


# = ADMIN CONFIG
admin.registration.secret=${ADMIN_REGISTRATION_SECRET:change-me-local-admin-secret}